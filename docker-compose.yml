version: '3.8'
services:
  instagram-dm-api:
    build: .
    restart: always
    environment:
      - WEBHOOK_URL=https://your-webhook.example.com/endpoint
      - POLL_INTERVAL=5
      - PORT=3016
    ports:
      - "3016:3016"
    volumes:
      - sessions_data:/data/sessions
volumes:
  sessions_data:
    driver: local
